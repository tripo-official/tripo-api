[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripo-api"
version = "0.1.0"
description = "Python client for the Tripo API: single-image to textured GLB 3D model generation via a hosted endpoint."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "tripo-official"}]
keywords = ["ai api", "hunyuan3d-3.1", "synexa", "tripo", "tripo api", "tripo python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/tripo-official/tripo-api"
Documentation = "https://tripo-official.github.io/tripo-api/"
"Hosted model" = "https://synexa.ai/explore/tripo3d/tripo"

[tool.setuptools.packages.find]
include = ["tripo_api*"]
